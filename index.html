<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ダーツの旅</title>
<meta name="description" content="5投で旅先を決めよう">
<meta property="og:type" content="website">
<meta property="og:title" content="ダーツの旅">
<meta property="og:description" content="5投で旅先を決めよう">
<meta name="twitter:card" content="summary">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<style>
:root{color-scheme:dark;--bg:#0b3157;--red:#c8322b;--ink:#f4ecd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;color:var(--ink);font-family:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:relative;height:100%}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;font-size:15px;pointer-events:none}
.hud b{font-size:24px;font-weight:800}
#banner{position:absolute;left:0;right:0;top:46%;text-align:center;pointer-events:none;opacity:0;transform:scale(.9);transition:opacity .25s,transform .25s}
#banner.on{opacity:1;transform:scale(1)}
#banner h1{display:table;margin:0 auto;padding:10px 28px;font-size:clamp(30px,9vw,52px);font-weight:800;background:#0b3157f2;border:3px solid var(--red);border-radius:6px;color:var(--ink)}
#banner p{display:table;margin:8px auto 0;padding:4px 14px;font-size:16px;background:#0b3157f2;border-radius:4px}#banner p:empty{display:none}
#hint{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:14px;opacity:.75;pointer-events:none}
#credit{position:absolute;bottom:calc(3px + env(safe-area-inset-bottom,0px));right:8px;font-size:10px;opacity:.4;pointer-events:none}
#end{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#0b3157ea;text-align:center}
#end.on{display:flex}
#end h2{margin:0;font-size:34px;font-weight:800}
#trip{list-style:none;margin:6px 0;padding:0;columns:2;column-gap:32px;text-align:left;font-size:19px;line-height:1.9}#trip li{break-inside:avoid}#trip .x{opacity:.5}#trip b{font-weight:800;display:inline-block;width:1.8em}
button{font:inherit;font-weight:800;font-size:18px;color:var(--ink);background:var(--red);border:0;border-radius:6px;padding:12px 28px;margin-top:12px;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style></head><body>
<div id="app"><canvas id="c"></canvas>
<div class="hud"><div>残り <b id="left">5</b> 投</div></div>
<div id="banner"><h1></h1><p></p></div>
<div id="hint">地図を読み込み中…</div>
<div id="credit">地図データ: 地球地図日本(国土地理院)</div>
<div id="end"><h2>旅行先が決まりました</h2><ol id="trip"></ol><button id="again">もう一度</button></div>
</div>
<script>
const NAMES=["北海道","青森","岩手","宮城","秋田","山形","福島","茨城","栃木","群馬","埼玉","千葉","東京","神奈川","新潟","富山","石川","福井","山梨","長野","岐阜","静岡","愛知","三重","滋賀","京都","大阪","兵庫","奈良","和歌山","鳥取","島根","岡山","広島","山口","徳島","香川","愛媛","高知","福岡","佐賀","長崎","熊本","大分","宮崎","鹿児島","沖縄"];
const pref=n=>n==='北海道'?n:n==='東京'?'東京都':(n==='大阪'||n==='京都')?n+'府':n+'県';
const $=id=>document.getElementById(id);
const cv=$('c'),g=cv.getContext('2d');
let W,H,dpr,S,X0,Y0,feats=null,mainBox,ready=false,insets=[];
const px=(x,y)=>[X0+(x-mainBox.minX)*S,Y0+(y-mainBox.minY)*S];
const geo=(x,y)=>[(x-X0)/S+mainBox.minX,(y-Y0)/S+mainBox.minY];
function bboxOf(polysArr){const b={minX:1e9,minY:1e9,maxX:-1e9,maxY:-1e9};polysArr.forEach(poly=>poly.forEach(ring=>ring.forEach(([x,y])=>{if(x<b.minX)b.minX=x;if(x>b.maxX)b.maxX=x;if(y<b.minY)b.minY=y;if(y>b.maxY)b.maxY=y})));return b}
function centroidOf(ring){let cx=0,cy=0;ring.forEach(([x,y])=>{cx+=x;cy+=y});return[cx/ring.length,cy/ring.length]}
function scalePolys(polysArr,cx,cy,k){return polysArr.map(poly=>poly.map(ring=>ring.map(([x,y])=>[cx+(x-cx)*k,cy+(y-cy)*k])))}
function fit(){dpr=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr}
function layout(){if(!ready)return;
 const mw=mainBox.maxX-mainBox.minX,mh=mainBox.maxY-mainBox.minY,ah=H*.54;
 S=Math.min(W*.94/mw,ah/mh);X0=(W-mw*S)/2;Y0=H*.04+(ah-mh*S)/2;
 const bw=mw*S*.24,bh=mh*S*.15,gap=mh*S*.03,x0=X0+mw*S*.02;
 insets.forEach((ins,i)=>{
  const sb={x:x0,y:Y0+i*(bh+gap)+mh*S*.03,w:bw,h:bh};
  const dw=ins.box.maxX-ins.box.minX,dh=ins.box.maxY-ins.box.minY;
  const sc=Math.min(sb.w/dw,sb.h/dh);
  const ox=sb.x+(sb.w-dw*sc)/2,oy=sb.y+(sb.h-dh*sc)/2;
  ins.screenBox=sb;ins.sc=sc;ins.ox=ox;ins.oy=oy;
  ins.toScreen=(x,y)=>[ox+(x-ins.box.minX)*sc,oy+(y-ins.box.minY)*sc];
  ins.toLocal=(x,y)=>[(x-ox)/sc+ins.box.minX,(y-oy)/sc+ins.box.minY]})}
function ringPtsWith(ring,fn){return ring.map(([x,y])=>fn(x,y))}
function polyContains(polys,tx,ty){
 for(const poly of polys){let inside=false;
  for(const ring of poly)for(let i=0,j=ring.length-1;i<ring.length;j=i++){
   const[xi,yi]=ring[i],[xj,yj]=ring[j];
   if(((yi>ty)!==(yj>ty))&&(tx<(xj-xi)*(ty-yi)/(yj-yi)+xi))inside=!inside}
  if(inside)return true}
 return false}
function clusterOthers(f,mainPolyIdx){
 return f.polys.map((poly,pi)=>pi).filter(pi=>pi!==mainPolyIdx).map(pi=>{const[cx,cy]=centroidOf(f.polys[pi][0]);return{poly:f.polys[pi],cx,cy}})}
function addInset(name,idx,polysArr){
 if(!polysArr.length)return;
 const box=bboxOf(polysArr);const[cx,cy]=(()=>{let sx=0,sy=0,n=0;polysArr.forEach(poly=>poly[0].forEach(([x,y])=>{sx+=x;sy+=y;n++}));return[sx/n,sy/n]})();
 insets.push({name,idx,polys:polysArr,polysBig:scalePolys(polysArr,cx,cy,1.3),box})}
async function loadMap(){
 try{
  const res=await fetch('https://cdn.jsdelivr.net/npm/jpn-atlas@1.0.2/japan/japan.json');
  const topo=await res.json();
  const fc=topojson.feature(topo,topo.objects.prefectures);
  feats=new Array(47);
  fc.features.forEach(f=>{const idx=parseInt(f.id,10)-1;if(idx<0||idx>46)return;
   const polys=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;
   let mainPolyIdx=0,bn=0;polys.forEach((p,pi)=>{if(p[0].length>bn){bn=p[0].length;mainPolyIdx=pi}});
   const big=polys[mainPolyIdx][0];
   let cx=0,cy=0;big.forEach(([x,y])=>{cx+=x;cy+=y});cx/=big.length;cy/=big.length;
   let bminX=1e9,bminY=1e9,bmaxX=-1e9,bmaxY=-1e9;big.forEach(([x,y])=>{if(x<bminX)bminX=x;if(x>bmaxX)bmaxX=x;if(y<bminY)bminY=y;if(y>bmaxY)bmaxY=y});
   feats[idx]={polys,mainPolyIdx,cx,cy,bbox:{minX:bminX,minY:bminY,maxX:bmaxX,maxY:bmaxY},drawPolys:polys}});
  mainBox={minX:1e9,minY:1e9,maxX:-1e9,maxY:-1e9};
  for(let i=0;i<46;i++){const b=feats[i].bbox;if(b.minX<mainBox.minX)mainBox.minX=b.minX;if(b.maxX>mainBox.maxX)mainBox.maxX=b.maxX;if(b.minY<mainBox.minY)mainBox.minY=b.minY;if(b.maxY>mainBox.maxY)mainBox.maxY=b.maxY}
  insets=[];
  addInset('沖縄',46,feats[46].polys);
  const kago=clusterOthers(feats[45],feats[45].mainPolyIdx);
  if(kago.length){addInset('奄美',45,kago.map(o=>o.poly));feats[45].drawPolys=[feats[45].polys[feats[45].mainPolyIdx]]}
  const tokyo=clusterOthers(feats[12],feats[12].mainPolyIdx);
  if(tokyo.length){
   const sorted=tokyo.slice().sort((a,b)=>a.cy-b.cy);
   let gi=sorted.length,gmax=-1;
   for(let i=1;i<sorted.length;i++){const gp=sorted[i].cy-sorted[i-1].cy;if(gp>gmax){gmax=gp;gi=i}}
   const izu=sorted.slice(0,gi),oga=sorted.slice(gi);
   if(izu.length)addInset('伊豆諸島',12,izu.map(o=>o.poly));
   if(oga.length)addInset('小笠原諸島',12,oga.map(o=>o.poly));
   feats[12].drawPolys=[feats[12].polys[feats[12].mainPolyIdx]]}
  ready=true;layout();pc=0;newPass();if(first)$('hint').textContent='上にスワイプで投擲'}
 catch(e){$('hint').textContent='地図の読み込みに失敗しました。通信環境をご確認のうえ再読み込みしてください。'}}
let mx=0,my=0,dir=0,lt=0;
let bx=0,by=0,wavy=false,spd=1,ph=0;
function apply(){mx=bx;my=by;if(!wavy)return;const w=Math.sin(ph);if(dir<2)mx+=W*.18*w;else my+=H*.07*w}
let pd=-1,pw=false,rot=0,pc=0;
function gm(){const mw=(mainBox.maxX-mainBox.minX)*S,mh=(mainBox.maxY-mainBox.minY)*S,c=Math.abs(Math.cos(rot)),n=Math.abs(Math.sin(rot));return{cx:X0+mw/2,cy:Y0+mh/2,hw:c*mw/2+n*mh/2,hh:n*mw/2+c*mh/2}}
function newPass(){if(!ready)return;do{dir=Math.floor(Math.random()*4);wavy=Math.random()<1/3}while(dir===pd&&wavy===pw);pd=dir;pw=wavy;
 spd=[1,1.05,1.1][Math.floor(Math.random()*3)];ph=0;
 rot=pc++===0?0:[0,90,180,240][Math.floor(Math.random()*4)]*Math.PI/180;
 const m=gm();bx=by=0;
 if(dir===0)by=-m.hh-m.cy;else if(dir===1)by=H*.8+m.hh-m.cy;else if(dir===2)bx=W+m.hw-m.cx;else bx=-m.hw-m.cx;apply()}
function move(dt){const v=H*.16*spd*dt,m=gm();let done=false;ph+=dt*2.2;
 if(dir===0){by+=v;done=by>H*.8+m.hh-m.cy}else if(dir===1){by-=v;done=by<-m.hh-m.cy}else if(dir===2){bx-=v;done=bx<-m.hw-m.cx}else{bx+=v;done=bx>W+m.hw-m.cx}
 if(done)newPass();else apply()}
let hist=[],left=5,visited=new Set(),marks=[],fl=null,trail=[],over=false,drag=null,first=true;
function dart(x,y,s,spin){g.save();g.translate(x,y);g.rotate(spin);g.scale(s,s);
 g.fillStyle='#0006';g.beginPath();g.ellipse(4,6,16,16,0,0,7);g.fill();
 for(let i=0;i<4;i++){g.save();g.rotate(i*Math.PI/2+Math.PI/4);g.fillStyle=i%2?'#f4ecd6':'#c8322b';g.beginPath();g.ellipse(0,-12,6,12,0,0,7);g.fill();g.restore()}
 g.fillStyle='#262626';g.strokeStyle='#f4ecd6';g.lineWidth=1.5;g.beginPath();g.arc(0,0,5,0,7);g.fill();g.stroke();g.restore()}
function drawFeature(polys,fn){g.beginPath();polys.forEach(poly=>poly.forEach(ring=>{const pts=ringPtsWith(ring,fn);pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath()}));g.fill('evenodd');g.stroke()}
function draw(now){requestAnimationFrame(draw);if(ready)move(lt?Math.min(.05,(now-lt)/1000):0);lt=now;g.setTransform(dpr,0,0,dpr,0,0);const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#2a86b0');gr.addColorStop(1,'#0b3157');g.fillStyle=gr;g.fillRect(0,0,W,H);
 const t=now/1000;g.lineWidth=2;g.lineCap='round';
 for(let k=0;k<16;k++){const by=H*(k+.5)/16,amp=5+k*.4,ph=k*1.7,sp=.6+(k%3)*.25;g.strokeStyle='rgba(255,255,255,'+(.07+(k%4)*.03)+')';g.beginPath();
  for(let x=0;x<=W+12;x+=12){const y=by+Math.sin(x*.018+t*sp+ph)*amp+Math.sin(x*.007-t*.5+k)*amp*.6;x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}
 if(ready){
  g.save();g.beginPath();g.rect(0,0,W,H*.8);g.clip();{const m=gm();g.translate(mx+m.cx,my+m.cy);g.rotate(rot);g.translate(-m.cx,-m.cy)}
  g.fillStyle='#e8dfc4';g.strokeStyle='#7d735a';g.lineWidth=1;g.lineJoin='round';
  for(let i=0;i<46;i++)drawFeature(feats[i].drawPolys,px);
  insets.forEach(ins=>{g.setLineDash([4,3]);g.strokeStyle='#f4ecd688';g.strokeRect(ins.screenBox.x,ins.screenBox.y,ins.screenBox.w,ins.screenBox.h);g.setLineDash([]);
   g.strokeStyle='#7d735a';drawFeature(ins.polys,ins.toScreen)});
  g.font='600 11px "Shippori Mincho B1",serif';g.textAlign='center';
  visited.forEach(i=>{const f=feats[i];const[x,y]=px(f.cx,f.cy);g.fillStyle='#c8322b';g.beginPath();g.arc(x,y,3.5,0,7);g.fill();g.fillStyle='#3a3320';g.save();g.translate(x,y);g.rotate(-rot);g.fillText(NAMES[i],0,-7);g.restore()});
  marks.forEach(m=>dart(m.x,m.y,.36,m.r));g.restore()}
 if(trail.length>1){g.strokeStyle='#f4ecd6aa';g.lineWidth=3;g.lineCap='round';g.beginPath();trail.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.stroke()}
 if(fl){let u=Math.min(1,(now-fl.t0)/fl.dur),e=1-(1-u)*(1-u);
  const x=fl.ox+(fl.tx-fl.ox)*e,y=fl.oy+(fl.ty-fl.oy)*e-Math.sin(Math.PI*u)*H*.05;
  dart(x,y,1.3-.94*e,u*9);if(u>=1)land()}
 else if(!over){const dx=drag&&trail.length?Math.max(-W*.2,Math.min(W*.2,(trail[trail.length-1].x-drag.x)*.3)):0;dart(W/2+dx,H*.9,1.3,0)}}
function banner(t,s){const b=$('banner');b.querySelector('h1').textContent=t;b.querySelector('p').textContent=s;b.classList.add('on');clearTimeout(banner.h);banner.h=setTimeout(()=>b.classList.remove('on'),1500)}
function land(){const{tx:x0,ty:y0}=fl;const m=gm(),dx=x0-mx-m.cx,dy=y0-my-m.cy,co=Math.cos(rot),si=Math.sin(rot),x=dx*co+dy*si+m.cx,y=-dx*si+dy*co+m.cy;
 let bi=-1;
 for(const ins of insets){const sb=ins.screenBox;
  if(x>=sb.x&&x<=sb.x+sb.w&&y>=sb.y&&y<=sb.y+sb.h){
   const[tx,ty]=ins.toLocal(x,y);if(polyContains(ins.polysBig,tx,ty)){bi=ins.idx}
   break}}
 if(bi<0){const[tx,ty]=geo(x,y);for(let i=0;i<46;i++){if(polyContains(feats[i].drawPolys,tx,ty)){bi=i;break}}}
 const onLand=y0<H*.8&&bi>=0;
 marks.push({x,y,r:Math.random()*6.28});fl=null;
 hist.push(onLand?bi:-1);if(onLand){visited.add(bi);banner(pref(NAMES[bi])+'に着弾','')}
 else banner('海に落ちた…',x0<0||x0>W||y0<0?'場外です。強さを調整してみよう。':'次は陸を狙おう。');
  if(left===0){over=true;setTimeout(end,1600)}}
function end(){
 const ol=$('trip');ol.innerHTML='';
 hist.forEach((b,i)=>{const li=document.createElement('li'),n=document.createElement('b');n.textContent=(i+1)+'.';li.appendChild(n);
  if(b<0){li.className='x';li.append('海(はずれ)')}else li.append(pref(NAMES[b]));ol.appendChild(li)});
 $('end').classList.add('on')}
function reset(){hist=[];left=5;visited=new Set();marks=[];fl=null;over=false;first=true;pc=0;newPass();$('left').textContent=5;$('end').classList.remove('on');if(ready)$('hint').style.opacity=.75}
$('again').onclick=reset;
function launch(vx,vy){const sN=Math.hypot(vx,vy)*1000/H;
 if(vy>-.25||sN<.8){banner('もっと勢いよく!','上に向かって素早くスワイプしてください。');return}
 const a=Math.max(-1,Math.min(1,Math.atan2(vx,-vy))),D=Math.max(.12,Math.min(1.25,sN*.24)),L=D*H*.85,ox=W/2,oy=H*.9;
 const j=()=>(Math.random()-.5)*H*.02;
 fl={t0:performance.now(),dur:650+D*250,ox,oy,tx:ox+Math.sin(a)*L+j(),ty:oy-Math.cos(a)*L+j()};
 left--;$('left').textContent=left;if(first){first=false;$('hint').style.opacity=0}}
cv.addEventListener('pointerdown',e=>{if(fl||over||!ready)return;cv.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY};trail=[{x:e.clientX,y:e.clientY,t:e.timeStamp}]});
cv.addEventListener('pointermove',e=>{if(!drag)return;trail.push({x:e.clientX,y:e.clientY,t:e.timeStamp})});
function up(e){if(!drag)return;const last=trail[trail.length-1];let f=trail[0];
 for(const p of trail)if(p.t>=last.t-120){f=p;break}
 const dt=Math.max(last.t-f.t,1);drag=null;trail=[];
 if(last.t-f.t<8){return}launch((last.x-f.x)/dt,(last.y-f.y)/dt)}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',()=>{drag=null;trail=[]});
addEventListener('resize',()=>{fit();layout();marks=[];if(ready)newPass()});
fit();requestAnimationFrame(draw);loadMap();
</script></body></html>
